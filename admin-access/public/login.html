<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · 校园交通</title><link rel="stylesheet" href="/login.css"></head>
<body><main class="login-shell">
<section class="identity" aria-label="校园交通"><img src="/assets/zju-emblem.png" alt="浙江大学校徽" width="72" height="72"><p>紫金港 · 校园交通</p><h1>管理员登录</h1><div class="road-art" aria-hidden="true"><svg viewBox="0 0 320 220"><path class="road" d="M-10 185H90Q145 185 145 130V-10M145 130Q145 65 210 65H330"/><path class="centerline" d="M-10 185H90Q145 185 145 130V-10M145 130Q145 65 210 65H330"/><circle cx="87" cy="185" r="6"/><circle cx="145" cy="36" r="6"/><circle cx="240" cy="65" r="6"/></svg></div></section>
<section class="form-panel" aria-labelledby="form-title"><h2 id="form-title">欢迎回来</h2><p class="intro" id="intro">登录后管理交通方案</p>
<form id="login-form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required spellcheck="false" autocapitalize="none" placeholder="请输入管理员账号">
<label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="请输入密码"><button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
<p class="password-help" id="password-help" hidden>使用 12–128 位密码</p><div id="confirmation" hidden><label for="confirm-password">确认密码</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="128" placeholder="再次输入密码"></div><p class="status" id="status" role="alert" hidden></p><button class="submit" id="submit" type="submit">登录</button></form>
<a class="visitor-link" id="visitor-link" href="/viewer/">查看交通沙盘 <span aria-hidden="true">↗</span></a></section>
</main><footer>数据来自交通仿真，仅供方案比较。</footer><script type="module" src="/login.mjs"></script></body></html>
