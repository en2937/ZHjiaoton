<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="浙大校园出行师生端：向 AI 提问，比较路线时间与距离。"><title>校园出行 · 师生 AI 助手</title><link rel="stylesheet" href="/student/style.css"></head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="route" viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 5h9a4 4 0 0 1 0 8H8a3 3 0 0 0 0 6h9"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3Z"/></symbol>
  <symbol id="swap" viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></symbol>
  <symbol id="send-icon" viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14"/></symbol>
</defs></svg>
<header class="topbar"><a class="brand" href="/student/" aria-label="校园出行首页"><img src="/student/emblem.png" alt="浙江大学校徽"><span><strong>校园出行</strong></span></a><div class="top-meta"><span class="campus">紫金港校区</span><span class="role-label">师生端</span><a class="management-link" href="http://127.0.0.1:4173/" target="_blank" rel="noopener">交通沙盘 ↗</a></div></header>
<main>
  <section class="intro"><h1>校园出行助手</h1><span class="simulation-clock" id="studentSimulationClock" hidden></span></section>
  <div class="workspace">
    <aside class="trip-panel" aria-labelledby="trip-title">
      <div class="panel-heading"><h2 id="trip-title">行程设置</h2></div>
      <div class="place-fields"><div class="place-dots" aria-hidden="true"><i></i><b></b><i></i></div><div class="place-selects"><label for="origin">出发地</label><select id="origin"><option value="1">云峰学园</option><option value="2">东教学楼</option></select><label for="destination">目的地</label><select id="destination"><option value="2">东教学楼</option><option value="1">云峰学园</option></select></div><button class="swap-button" id="swap-places" aria-label="交换出发地和目的地"><svg><use href="#swap"/></svg></button></div>
      <fieldset><legend>怎么出发</legend><div class="mode-options"><button data-mode="electric" aria-pressed="true">电动车</button><button data-mode="bicycle" aria-pressed="false">自行车</button></div></fieldset>
      <fieldset><legend>更在意什么</legend><div class="preference-options"><button data-preference="time" aria-pressed="true"><svg><use href="#clock"/></svg>优先省时</button><button data-preference="distance" aria-pressed="false"><svg><use href="#route"/></svg>优先近路</button></div></fieldset>
    </aside>
    <section class="chat-panel" aria-labelledby="chat-title">
      <div class="chat-header"><div><span class="assistant-mark"><svg><use href="#spark"/></svg></span><h2 id="chat-title">路线建议</h2></div><button class="reset-button" id="reset-chat">新对话</button></div>
      <div class="conversation" id="conversation" aria-live="polite" aria-relevant="additions">
        <div class="welcome" id="welcome"><div class="welcome-icon"><svg><use href="#spark"/></svg></div><h3>今天想怎么走？</h3><p>选好行程，比较路线或查询上课出发时间。</p><div class="suggestions"><button data-question="哪条路更快？">哪条路更快？<svg><use href="#arrow"/></svg></button><button data-question="哪条路距离更短？">哪条路更近？<svg><use href="#arrow"/></svg></button><button data-question="我想去东教上早八，我几点出发最好？">早八几点出发？<svg><use href="#arrow"/></svg></button></div></div>
      </div>
      <div class="composer-area"><p class="status" id="status" role="status" hidden></p><form id="question-form"><label class="sr-only" for="question">向出行助手提问</label><textarea id="question" rows="1" maxlength="1000" placeholder="现在走哪条路更合适？"></textarea><button id="cancel-question" type="button" hidden>取消</button><button id="send" type="submit" aria-label="发送问题"><svg><use href="#send-icon"/></svg></button></form></div>
    </section>
  </div>
  <footer><p id="studentDataSourceNote">基于模拟数据，用时与距离为估算。</p></footer>
</main><script type="module" src="/student/app.mjs"></script>
</body></html>
